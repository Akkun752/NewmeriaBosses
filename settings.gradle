pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'NewmeriaBosses'

// NewmeriaCore and NewmeriaRPG are built from their sources in the sibling folders: no need to publish
// them anywhere, and a change made there is picked up here on the next build.
includeBuild('../NewmeriaCore') {
    dependencySubstitution {
        substitute module('fr.akkun.newmeriacore:newmeriacore') using project(':')
    }
}
includeBuild('../NewmeriaRPG') {
    dependencySubstitution {
        substitute module('fr.akkun.newmeriarpg:newmeriarpg') using project(':')
    }
}
